spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
            - id: job-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/jobs/**
            - id: search-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/search/**
            - id: application-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/application/**
            - id: ai-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/ai/**

jwt:
  secret: workforge-secret-key-dev-minimum-32-chars

server:
  port: 8086

