name: search-service CI

on:
  push:
    branches: [ main ]
    paths:
      - 'search-service/**'
      - '.github/workflows/search-service-ci.yml'
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Increase vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Build and test
        working-directory: search-service
        run: ./gradlew build test
